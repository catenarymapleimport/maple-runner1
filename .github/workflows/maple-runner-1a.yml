name: Maple Runner 1a

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  yggdrasil-check:
    runs-on: ubuntu-latest

    steps:
      - name: Install Yggdrasil
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq python3

          # Select specifically the standard deb package, excluding vyos builds
          LATEST_DEB_URL=$(curl -sS https://api.github.com/repos/yggdrasil-network/yggdrasil-go/releases/latest | \
            jq -r '.assets[] | select(.name | test("^yggdrasil-[0-9].*amd64\\.deb$")) | .browser_download_url' | head -n 1)

          echo "Downloading Yggdrasil from: ${LATEST_DEB_URL}"
          curl -sSL -o yggdrasil.deb "${LATEST_DEB_URL}"

          # Install package and dependencies
          sudo dpkg -i yggdrasil.deb || sudo apt-get install -f -y
          rm -f yggdrasil.deb

      - name: Configure Peer and Start Service
        env:
          YGGDRASIL_PEER_IP: ${{ secrets.YGGDRASIL_PEER_IP }}
        run: |
          # Ensure configuration directory exists
          sudo mkdir -p /etc/yggdrasil

          # Generate initial JSON configuration
          yggdrasil -genconf -json | sudo tee /etc/yggdrasil/yggdrasil.conf > /dev/null

          # Format URI dynamically based on IPv4 vs IPv6
          if [[ "${YGGDRASIL_PEER_IP}" == *:* ]]; then
            # IPv6 address: wrap in brackets
            PEER_URI="tls://[${YGGDRASIL_PEER_IP}]:37186"
          else
            # IPv4 address: standard ip:port format
            PEER_URI="tls://${YGGDRASIL_PEER_IP}:37186"
          fi

          # Safely append peer URI using Python
          sudo PEER_URI="${PEER_URI}" python3 -c '
          import json, os
          path = "/etc/yggdrasil/yggdrasil.conf"
          with open(path, "r") as f:
              data = json.load(f)
          data["Peers"].append(os.environ["PEER_URI"])
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
          '

          # Mirror config to /etc/yggdrasil.conf for fallback compatibility
          sudo cp /etc/yggdrasil/yggdrasil.conf /etc/yggdrasil.conf

          # Enable and start service
          sudo systemctl restart yggdrasil

      - name: Verify Peer Connection and Ping Target
        env:
          YGGDRASIL_PEER_IP: ${{ secrets.YGGDRASIL_PEER_IP }}
        run: |
          # Allow setup time for connection establishment
          sleep 10

          echo "=== Yggdrasil Self Address ==="
          sudo yggdrasilctl -endpoint=unix:///var/run/yggdrasil/yggdrasil.sock getSelf

          echo "=== Yggdrasil Connected Peers ==="
          sudo yggdrasilctl -endpoint=unix:///var/run/yggdrasil/yggdrasil.sock getPeers

          echo "=== Extracting Peer Mesh IPv6 ==="
          # Extracts the internal 200::/7 IPv6 address of the connected peer from yggdrasilctl JSON output
          PEER_MESH_IP=$(sudo yggdrasilctl -endpoint=unix:///var/run/yggdrasil/yggdrasil.sock getPeers -json | \
            jq -r '.peers[] | select(.up == true) | .address' | head -n 1)

          if [ -z "${PEER_MESH_IP}" ] || [ "${PEER_MESH_IP}" == "null" ]; then
            echo "Error: No active connected peer found in Yggdrasil network."
            exit 1
          fi

          echo "Targeting Yggdrasil Mesh IP: ${PEER_MESH_IP}"

          echo "=== Executing Ping Test over Yggdrasil Mesh ==="
          ping -c 5 "${PEER_MESH_IP}"
